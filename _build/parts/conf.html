<form class="conf" data-conf action="contact.html" method="get">
          <div>
            <fieldset>
              <legend>La création du site</legend>
              <div class="opts">
                <label class="opt"><input type="radio" name="formule" value="Essentiel" data-price="890"><span><b>Essentiel</b><em>890 €</em><small>Une page, fiche Google, formulaire de contact.</small></span></label>
                <label class="opt"><input type="radio" name="formule" value="Pro" data-price="1490" checked><span><b>Pro</b><em>1 490 €</em><small>Jusqu'à 6 pages, devis en ligne, galerie.</small></span></label>
                <label class="opt"><input type="radio" name="formule" value="Sur-mesure" data-price="1990" data-from><span><b>Sur-mesure</b><em>dès 1 990 €</em><small>Réservation, boutique, multilingue.</small></span></label>
              </div>
            </fieldset>
            <fieldset>
              <legend>L'entretien, chaque mois</legend>
              <div class="opts">
                <label class="opt"><input type="radio" name="abonnement" value="Veille" data-price="39"><span><b>Veille</b><em>39 €</em><small>Hébergement, sécurité, 2 modifications par mois.</small></span></label>
                <label class="opt"><input type="radio" name="abonnement" value="Confort" data-price="69" checked><span><b>Confort</b><em>69 €</em><small>Modifications illimitées, fiche Google suivie.</small></span></label>
                <label class="opt"><input type="radio" name="abonnement" value="Croissance" data-price="119" data-from><span><b>Croissance</b><em>dès 119 €</em><small>Une page en plus chaque mois, point trimestriel.</small></span></label>
              </div>
            </fieldset>
          </div>
          <aside class="sum" aria-live="polite">
            <p class="sum__name" data-sum-name>Pro + Confort</p>
            <dl>
              <dt>À la commande (30 %)</dt><dd data-sum-deposit>447 €</dd>
              <dt>À la mise en ligne (70 %)</dt><dd data-sum-balance>1 043 €</dd>
              <dt>Puis chaque mois</dt><dd data-sum-month>69 €</dd>
              <dt class="tot">Première année</dt><dd class="tot" data-sum-year>2 318 €</dd>
            </dl>
            <button class="btn" type="submit">Recevoir ce devis</button>
            <p class="small">Prix nets, TVA non applicable. Abonnement de 12 mois minimum, puis sans engagement. <span data-sum-note></span></p>
          </aside>
        </form>
